# Refreshes content/github.json daily (brief §6). When the data changed, it commits the
# file and starts the Deploy workflow: pushes made with GITHUB_TOKEN don't trigger other
# workflows, but workflow_dispatch does. The agent Worker reads the published
# /github.json, so it picks up the new snapshot without a deploy of its own.
name: GitHub activity

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: github-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm test:content
      - name: Commit and deploy if it changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet content/github.json; then
            echo "No new GitHub activity."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content: refresh GitHub activity' content/github.json
          git push
          gh workflow run deploy.yml --ref main
