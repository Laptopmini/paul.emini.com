# Deploys the static export to GitHub Pages (Settings → Pages → Source = "GitHub Actions").
# The custom domain is set in Settings → Pages → Custom domain; a CNAME file is ignored
# for Actions deployments. Until it is set, the site is served from
# laptopmini.github.io/paul.emini.com/, so the build takes its base path from configure-pages.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v6
      - run: pnpm build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Repository variable (not a secret): the Worker's public URL. Unset = the chat
          # shows its unavailable state and the rest of the site works.
          NEXT_PUBLIC_AGENT_URL: ${{ vars.AGENT_URL }}
          # Repository variable (public): the Turnstile widget's site key.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
